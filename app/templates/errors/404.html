{% extends "base.html" %}
{% block title %}Page Not Found — {{ clinic_name }}{% endblock %}
{% block content %}
<section class="page-fade max-w-2xl mx-auto px-4 py-32 text-center">
  <p class="text-8xl font-heading font-extrabold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">404</p>
  <h1 class="mt-4 text-2xl md:text-3xl font-heading font-bold text-slate-900 dark:text-white">We couldn't find that page</h1>
  <p class="mt-3 text-slate-500 dark:text-slate-400">The page you're looking for may have moved or no longer exists.</p>
  <a href="{{ url_for('main.home') }}" class="inline-flex mt-8 items-center gap-2 bg-primary hover:bg-primary-600 text-white font-semibold px-6 py-3 rounded-full shadow-soft transition-all hover:-translate-y-0.5">
    Back to Home
  </a>
</section>
{% endblock %}
